name: ScreenAtlas checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -B -m unittest discover -s tests -v
      - run: node --check atlas/web/app.js
      - run: node --test tests/test_connections.cjs
      - run: python -m screen_atlas --project atlas/examples/second-sole check
      - run: python -m pip wheel . --no-deps --wheel-dir dist
